name: CI

# Runs the branch gate on every push and pull request: the lockfile check, format, spellcheck, markdown lint,
# build, ESLint, the over-exposure check and the unit tests under their 100% coverage gate. It is the same code
# `npm run version` runs as its release preflight, so a green run here is a release that will not abort halfway.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    env:
      # `npm ci` runs the `prepare` script, which installs husky -- pointless in CI.
      HUSKY: 0
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Gate
        run: npm run gate

      # The gate built `dist/`, so this packs what a release would publish, installs it into an empty project and
      # loads every exported module as ESM and as CommonJS. It installs the package's dependencies from the
      # registry, so it stays out of the gate.
      - name: Pack smoke
        run: npm run smoke:pack
